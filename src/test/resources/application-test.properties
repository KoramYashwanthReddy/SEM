spring.datasource.url=jdbc:h2:mem:ai_exam_system_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.jwt.secret=TestJwtSecretKey_TestJwtSecretKey_TestJwtSecretKey_TestJwtSecretKey_123456
app.jwt.access-expiration=86400000
app.jwt.refresh-expiration=604800000

spring.data.redis.repositories.enabled=false
spring.task.scheduling.enabled=false
app.email.enabled=false
spring.devtools.restart.enabled=false

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
