# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${SERVER_PORT:8080}
spring.application.name=ai-exam-system
server.error.include-message=never
server.error.include-binding-errors=never

# ===============================
# PROFILES
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# DATASOURCE (FINAL STABLE - DO NOT CHANGE)
# ===============================
# Persistent H2 DB (NO PASSWORD → prevents duplicate DB creation issues)
spring.datasource.url=jdbc:h2:file:./data/ai_exam_system;MODE=MYSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=SEM@2025
spring.datasource.driver-class-name=org.h2.Driver

# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# H2 CONSOLE (DEV)
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# ===============================
# JWT (SAFE DEFAULT)
# ===============================
app.jwt.secret=AiExamSystemSecureKey_ChangeInProduction_2026!
app.jwt.access-expiration=86400000
app.jwt.refresh-expiration=604800000

# ===============================
# AUTO ADMIN (SAFE)
# ===============================
app.bootstrap.admin.enabled=true
app.bootstrap.admin.email=admin@ai-exam.local
app.bootstrap.admin.password=Admin@123456
app.bootstrap.admin.name=Platform Admin


# ===============================
# CORS
# ===============================
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*

# ===============================
# REDIS (OPTIONAL)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# DEVTOOLS
# ===============================
spring.devtools.restart.enabled=true

# ===============================
# JACKSON
# ===============================
spring.jackson.default-property-inclusion=non_null

# ===============================
# EMAIL (ONLY CHANGE THIS)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=koramyashwanthr@gmail.com
spring.mail.password=qhertdevtddtkhog
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# STORAGE
# ===============================
file.storage.base-path=storage/
file.storage.snapshot-path=storage/snapshots/
file.storage.audio-path=storage/audio/
file.storage.log-path=storage/logs/

# ===============================
# FRONTEND
# ===============================
app.frontend.base-url=http://localhost:3000
app.frontend.reset-url=http://localhost:3000/reset-password

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
