# =====================================================
# APPLICATION
# =====================================================
spring.application.name=sem

# =====================================================
# SERVER
# =====================================================
server.port=${SERVER_PORT:8080}

server.error.include-message=never
server.error.include-binding-errors=never

# =====================================================
# ACTIVE PROFILE
# =====================================================
spring.profiles.active=local

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =====================================================
# HIKARI CONNECTION POOL
# =====================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================
# MULTIPART
# =====================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# JACKSON
# =====================================================
spring.jackson.default-property-inclusion=non_null

# =====================================================
# DEVTOOLS
# =====================================================
spring.devtools.restart.enabled=true

# =====================================================
# LOGGING
# =====================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# =====================================================
# CORS
# =====================================================
app.cors.allowed-origins=http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500

app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*

# =====================================================
# STORAGE
# =====================================================
file.storage.base-path=storage/
file.storage.snapshot-path=storage/snapshots/
file.storage.audio-path=storage/audio/
file.storage.log-path=storage/logs/

# =====================================================
# FRONTEND
# =====================================================
app.frontend.base-url=http://localhost:3000
app.frontend.reset-url=http://localhost:3000/reset-password

# =====================================================
# REDIS
# =====================================================
spring.data.redis.repositories.enabled=false

# =====================================================
# ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never