<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>401 Unauthorized | SEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=DM+Sans:ital,opsz,wght@0,9..400,100..1000;1,9..400,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/core/css/themes.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      color: var(--text-primary);
      position: relative;
      overflow: hidden;
    }

    .noise-overlay {
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.02;
      pointer-events: none;
      z-index: 1;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: var(--accent-purple);
      top: -100px;
      right: -100px;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: var(--accent-blue);
      bottom: -150px;
      left: -150px;
    }

    .error-header {
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand .logo-icon {
      font-size: 24px;
    }

    .brand .brand-text {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    .error-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      max-width: 640px;
      margin: 0 auto;
      z-index: 10;
    }

    .status-code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(96px, 14vw, 150px);
      font-weight: 900;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.04em;
    }

    .status-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      color: var(--text-primary);
      margin: 16px 0 12px 0;
    }

    .status-desc {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin: 0 0 32px 0;
      max-width: 480px;
    }

    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 99px;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent-purple);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
    }

    .btn-primary:hover {
      background: var(--accent-violet);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--text-secondary);
      transform: translateY(-2px);
    }

    .lock-icon {
      font-size: 40px;
      margin-bottom: -10px;
    }
  </style>
</head>
<body>
  <div class="noise-overlay"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <header class="error-header">
    <a href="/" class="brand">
      <span class="logo-icon">🧠</span>
      <span class="brand-text">SEM</span>
    </a>
  </header>

  <main class="error-container">
    <div class="lock-icon">🔒</div>
    <h1 class="status-code">401</h1>
    <h2 class="status-title">Unauthorized Access</h2>
    <p class="status-desc">
      You do not have permission to view this resource. Please verify your credentials or log in to access this area.
    </p>
    <div class="btn-group">
      <a href="/pages/role-selection.html" class="btn btn-primary">Log In</a>
      <button onclick="history.back()" class="btn btn-ghost">Go Back</button>
    </div>
  </main>
</body>
</html>
